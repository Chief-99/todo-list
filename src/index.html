<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
</head>

<body>
    <section id="sidebar">
        <div class="top-container">
            <button id="open-todo-form">+ Add todo</button>
            <div class="statistic-section">

            </div>
            <div class="projects-section">
                <p id="all-tasks">All tasks</p>
                <p class="projects-heading">PROJECTS</p>
                <div id="projects-list">

                </div>
            </div>
        </div>
        <button id="new-project-button">New project</button>
    </section>

    <main id="main-content">
        <div class="main-header">
            <p class="current-list">Main list</p>

            <div class="filter">
                <button class="all">All</button>
                <button class="active">Active</button>
                <button class="completed">Completed</button>
            </div>
        </div>

        <div id="display-div">
        </div>
    </main>

    <!--* TODO FORMS -->
    <div id="modal">
        <div id="modal-content">
            <form id="todo-form">
                <p class="form-section">
                    <label for="title-input">Title:</label>
                    <input type="text" id="title-input" minlength="3" required>
                </p>

                <p class="form-section">
                    <label for="description-input">Description:</label>
                    <textarea name="description-input" id="description-input"></textarea>
                </p>

                <div class="due-date-priority form-section">
                    <p class="secondary-container">
                        <label for="due-date-input">Due date:</label>
                        <input type="date" id="due-date-input">
                    </p>

                    <p class="secondary-container">
                        <label for="priority-input">Priority</label>
                        <select name="priority-input" id="priority-input">
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </p>
                </div>

                <div class="buttons-container">
                    <button id="cancel-todo">Cancel</button>
                    <button id="add-todo" type="submit">Confirm</button>
                </div>


            </form>

        </div>
    </div>

    <!--* PROJECT FORM -->
    <div id="project-modal">
        <div id="project-modal-content">
            <form id="project-form">
                <p class="project-form-section">
                    <label for="project-name-input">Project name:</label>
                    <input type="text" id="project-name-input" minlength="3" required>
                </p>
                <div class="buttons-container">
                    <button id="cancel-project">Cancel</button>
                    <button id="confirm-project">Confirm</button>
                </div>
            </form>
        </div>
    </div>


    

</body>

</html>
